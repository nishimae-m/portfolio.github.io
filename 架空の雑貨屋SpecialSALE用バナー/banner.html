<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Hover Effect Example</title>
  <style>
    .click {
      position: relative;
      overflow: hidden;
      margin-left: 190px;
      bottom: 290px;
    }

    .click img {
      transition: transform 0.1s;
      z-index: 100;
      width: 17%;
      height: 17%;
    }

    .click img:hover {
      transform: translateY(5px);
    }

    .banner img {
      width: 100%;
      height: 100%;
    }

    /* メディアクエリ */
    @media (max-width: 1200px) {
      .click {
        width: 25%;
        height: 25%;
        margin-left: 200px;
        bottom: 300px;
      }
    }

    @media (max-width: 992px) {
      .click {
        width: 18%;
        height: 18%;
        margin-left: 150px;
        bottom: 250px;
      }
    }

    @media (max-width: 768px) {
      .click {
        width: 14%;
        height: 14%;
        margin-left: 100px;
        bottom: 200px;
      }
    }

    @media (max-width: 576px) {
      .click {
        width: 10%;
        height: 10%;
        margin-left: 50px;
        bottom: 150px;
      }
    }
  </style>
</head>

<body>
  <div class="banner">
    <img src="img/banner.png" alt="banner Image" />
  </div>
  <a href="https://example.com" class="click">
    <img src="img/click.png" alt="click Image" />
  </a>
</body>

</html>
